name: eQMS CI

on:
  push:
    paths:
      - 'eqms/**'
      - '.github/workflows/eqms-ci.yml'
  pull_request:
    paths:
      - 'eqms/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r eqms/api/requirements.txt
      - run: python -m py_compile eqms/api/app/*.py
      - run: |
          cd eqms/api
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          r = client.get('/api/health')
          assert r.status_code == 200
          assert r.json()['status'] == 'ok'
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: eqms/web
      - run: npm run build
        working-directory: eqms/web
